<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" shape-rendering="crispEdges">
  <!-- Background circle -->
  <circle cx="50" cy="50" r="50" fill="#0F0F0F"/>

  <!-- Three bold diagonal slash bars — abstract "signal / voice / broadcast" mark -->
  <!-- Bar 1 (left) -->
  <rect x="18" y="28" width="14" height="44" rx="4" fill="#F5F5F5" transform="rotate(-15 25 50)"/>

  <!-- Bar 2 (mid) -->
  <rect x="38" y="20" width="14" height="52" rx="4" fill="#E63946" transform="rotate(-15 45 46)"/>

  <!-- Bar 3 (right) -->
  <rect x="58" y="28" width="14" height="44" rx="4" fill="#F5F5F5" transform="rotate(-15 65 50)"/>
</svg>
